        body {

            color: white;
            background-color: #000;
        }

        .video-background {
            position: fixed ;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .video-background video {
            width: 100%;

        .content {
            position: relative;
            z-index: 1;

            flex-direction: column;

            text-align: center;
            padding: 20px;
        }

        .content .text p {
            font-size: 1.2rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            margin-bottom: 50px;
        }

        .content .text h1 {
            font-size: 3rem;
            margin-bottom: 15px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .content a button {
            position: relative;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg,#2934d8 );
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(6, 6, 10, 0.4);
            transition: all 0.3s ;
            margin-top: 10px;
        }

        .content a button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(10, 5, 36, 0.6);
        }

        .content a button::after {
            content: "Klik untuk detail selengkapya! "; 
            position: absolute;
            bottom: 130%; 
            left: 50%;
            transform: translateX(-50%) scale(0.8); 
            background-color: #ffffff;
            color: #2d3436;
            padding: 8px 16px;
            font-size: 1rem;
            border-radius: 8px;
            white-space: nowrap; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: all 0.3s;
        }

        .content a button::before {
            content: "";
            position: absolute;
            bottom: 110%;
            left: 50%;
            border-radius: 8px;
            transform: translateX(-50%) scale(0.8);
            border-width: 8px 8px 0 8px;
            border-style: solid;
            border-color: #ffffff ;
            opacity: 0;
            transition: all 0.3s;
        }

        .content a button:hover::after,
        .content a button:hover::before {
            opacity: 1;
            transform: translateX(-50%) scale(1); 

        }

        .audio-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .audio-control:hover {
            background: white;
            color: black;
        }
    </style>
</head>
<body>

    <div class="video-background">
        <video id="myVideo" autoplay loop muted playsinline>

    </div>


    <button class="audio-control" id="audioBtn">muted</button>

    <div class="content">
        <div class="text">
        <h1>Selamat Datang</h1>
        <p>Di Biodata Kelas 11 Angkatan 6 SMK Negeri 71 Jakarta Tahun Ajaran 2026/2027</p>
        </div>
        <a href="index.php">
            <button>Lihat Biodata</button>
        </a>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const audioBtn = document.getElementById('audioBtn');

        audioBtn.addEventListener('click', function() {
            if (video.muted) {
                video.muted = false; 
                audioBtn.innerHTML = "sound";
            } else {
                video.muted = true; 
                audioBtn.innerHTML = "muted";
            }
        });
    </script>

</body>
